<script>
$(document).on("runestone:pre-login-complete", function() {
    console.log("pre-login-complete");
})
var runestoneMathReady = new Promise((resolve) => window.rsMathReady = resolve);
window.addEventListener("error", function(event) {
    const target = event.target;
    if (
        target?.tagName === "SCRIPT" &&
        /mathjax/i.test(target.src)
    ) {
        window.rsMathReady(null);
    }
}, true);
window.MathJax = {
  tex: {
    inlineMath: [['\\(','\\)'], ['$','$']],
    tags: "none",
    tagSide: "right",
    tagIndent: ".8em",
    packages: {'[+]': ['base', 'extpfeil', 'ams', 'amscd', 'newcommand', 'knowl']}
  },
  options: {
    ignoreHtmlClass: "tex2jax_ignore|ignore-math",
    processHtmlClass: "process-math",
    renderActions: {
        findScript: [10, function (doc) {
            document.querySelectorAll('script[type^="math/tex"]').forEach(function(node) {
                var display = !!node.type.match(/; *mode=display/);
                var math = new doc.options.MathItem(node.textContent, doc.inputJax[0], display);
                var text = document.createTextNode('');
                node.parentNode.replaceChild(text, node);
                math.start = {node: text, delim: '', n: 0};
                math.end = {node: text, delim: '', n: 0};
                doc.math.push(math);
            });
        }, '']
    },
  },
  chtml: {
    scale: 0.88,
    mtextInheritFont: true
  },
  loader: {
    load: ['input/asciimath', '[tex]/extpfeil', '[tex]/amscd', '[tex]/newcommand'],
  },
  startup: {
    ready() {
        // MathJax 4 replaced the internals that PreTeXt's
        // mathjaxknowl3.js extension used, so define the \knowl macro
        // here, the way PreTeXt's own MathJax 4 startup does.
        const { Configuration } = MathJax._.input.tex.Configuration;
        Configuration.create("knowl", { handler: { macro: ["knowl"] } });
        const NodeUtil = MathJax._.input.tex.NodeUtil.default;
        function GetArgumentMML(parser, name) {
            const arg = parser.ParseArg(name);
            if (!NodeUtil.isInferred(arg)) {
                return arg;
            }
            const children = NodeUtil.getChildren(arg);
            if (children.length === 1) {
                return children[0];
            }
            const mrow = parser.create("node", "mrow");
            NodeUtil.copyChildren(arg, mrow);
            NodeUtil.copyAttributes(arg, mrow);
            return mrow;
        }
        const CommandMap = MathJax._.input.tex.TokenMap.CommandMap;
        new CommandMap("knowl", {
            knowl(parser, name) {
                const url = parser.GetArgument(name);
                const arg = GetArgumentMML(parser, name);
                const mrow = parser.create("node", "mrow", [arg], {
                    tabindex: "0",
                    "data-knowl": url,
                });
                parser.Push(mrow);
            },
        });
        MathJax.startup.defaultReady();
    },
    pageReady() {
      return MathJax.startup.defaultPageReady().then(
        function () {
          console.log("in ready function");
          window.rsMathReady(MathJax);
        },
        function (error) {
          console.error("MathJax failed during page setup", error);
          window.rsMathReady(null);
        },
      );
    }
},
};
</script>

<script src="https://cdn.jsdelivr.net/npm/mathjax@4/tex-mml-chtml.js"></script>
